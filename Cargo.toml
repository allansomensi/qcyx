[workspace.package]
description = "Unofficial CLI for controlling QCY earbuds over BLE"
version = "0.2.0"
authors = ["Allan Somensi <allansomensidev@proton.me>"]
documentation = "https://github.com/allansomensi/qcyx"
homepage = "https://github.com/allansomensi/qcyx"
repository = "https://github.com/allansomensi/qcyx"
readme = "README.md"
keywords = ["bluetooth", "qcy", "audio", "cli", "gui"]
categories = ["command-line-utilities", "multimedia::audio", "hardware-support"]
license = "MIT"
exclude = ["/.github/", "/pkg/"]
edition = "2024"

[workspace]
members = [
    "crates/core",
    "crates/cli",
    "crates/gui",
    "crates/i18n",
    "crates/qcyx",
]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
qcyx_core = { path = "crates/core" }
qcyx_i18n = { path = "crates/i18n" }

btleplug = "0.13"
uuid = "1.26"

futures = "0.3.34"
clap = { version = "4.6", features = ["derive"] }
iced = { version = "0.14", features = ["tokio", "svg", "image"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2.0"

# Persistence (profiles, app settings, EQ profiles)
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native "open/save file" dialogs for profile import/export
rfd = "0.17"

# Debug
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# i18n
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
rust-embed = "8.9"
unic-langid = "0.9"

winresource = "0.1"

# Dev
cargo-husky = { version = "1.5.0", default-features = false, features = [
    "run-for-all",
    "prepush-hook",
    "precommit-hook",
    "run-cargo-test",
    "run-cargo-clippy",
    "run-cargo-fmt",
] }
